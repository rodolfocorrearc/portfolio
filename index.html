<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodolfo Correa — Inteligência Comercial, Conteúdo & Estratégia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D; 
    --ink: #F5F5F5;
    --accent: #FF3B00;
    --accent-light: rgba(255, 59, 0, 0.12);
    --accent-border: rgba(255, 59, 0, 0.3);
    --ink-soft: rgba(245, 245, 245, 0.65);
    --ink-xsoft: rgba(245, 245, 245, 0.25);
    --card-hover: rgba(255, 255, 255, 0.03);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); }

  /* Nav */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: flex-end; padding: 1.25rem clamp(1.5rem, 6vw, 5rem); background: rgba(13, 13, 13, 0.85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--accent-border); }
  .nav-right { display: flex; align-items: center; gap: 2rem; }
  .nav-link { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); text-decoration: none; }
  .nav-link:hover { color: var(--accent); }

  /* Hero */
  .hero { min-height: 100svh; display: grid; grid-template-columns: 1.2fr 0.8fr; align-items: center; padding: 8rem clamp(2rem, 6vw, 5rem); border-bottom: 1px solid var(--accent-border); }
  .hero-headline { font-family: var(--serif); font-size: clamp(3.5rem, 6vw, 6rem); line-height: 1.05; }
  .hero-headline em { font-style: italic; color: var(--accent); }
  .hero-bio { font-size: 1.05rem; font-weight: 300; color: var(--ink-soft); max-width: 46ch; margin: 2rem 0; border-left: 2px solid var(--accent); padding-left: 1.5rem; }
  .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--accent); color: #FFF; padding: 1rem 2rem; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; border-radius: 2px; }

  /* Carrossel Ajustado */
  .brands-section { padding: 4rem 0; border-bottom: 1px solid var(--ink-xsoft); background: #050505; }
  .brands-track { display: flex; align-items: center; gap: 6rem; width: max-content; animation: scrollBrands 15s linear infinite; }
  @keyframes scrollBrands { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .brand-item { height: 100px; filter: brightness(0) invert(1) opacity(0.5); }
  .brand-item img { height: 100%; width: auto; object-fit: contain; }

  /* Grid Projetos */
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; padding: 4rem clamp(1.5rem, 6vw, 5rem); }
  .work-card { padding: 2.5rem; background: rgba(255,255,255,0.02); border: 1px solid var(--accent-border); text-decoration: none; color: inherit; transition: 0.3s; }
  .work-card:hover { border-color: var(--accent); }

  /* Contact Strip */
  .contact-strip { background: #111; padding: 6rem clamp(1.5rem, 6vw, 5rem); border-top: 1px solid var(--accent-border); display: flex; justify-content: space-between; align-items: center; }
  .contact-headline { font-family: var(--serif); font-size: 3rem; }
  .contact-actions { display: flex; gap: 1rem; }
  .contact-btn { padding: 1rem 2rem; text-decoration: none; font-weight: 700; border-radius: 2px; color: #000; }
  .contact-btn--whatsapp { background: #25D366; }
  .contact-btn--linkedin { background: #0A66C2; color: #FFF; }

  @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } .contact-strip { flex-direction: column; gap: 2rem; } }
</style>
</head>

    <div class="brand-item"><img src="https://raw.githubusercontent.com/rodolfocorrearc/portfolio/main/rpc-globo.png" alt="RPC"></div>

    <div class="brand-item"><img src="https://raw.githubusercontent.com/rodolfocorrearc/portfolio/main/COCAMAR.png" alt="Cocamar"></div>
    <div class="brand-item"><img src="https://raw.githubusercontent.com/rodolfocorrearc/portfolio/main/Acim.png" alt="Acim"></div>
  </div>
</div>

<section id="work" class="works-grid">

  </div>
